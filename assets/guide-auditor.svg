<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" role="img" aria-label="How the Hash &amp; Password Auditor works" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#18c8ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="1000" height="210" rx="16" fill="#14141b" stroke="#262633"/><text x="24" y="34" fill="#fff" font-size="18" font-weight="700">How the Hash &amp; Password Auditor works</text><rect x="20" y="52" width="293" height="140" rx="12" fill="#0b0b10" stroke="#262633"/><circle cx="50" cy="82" r="15" fill="url(#g)"/><text x="50" y="88" text-anchor="middle" fill="#05050c" font-size="16" font-weight="700">1</text><text x="297" y="92" font-size="30" text-anchor="end">⌨️</text><text x="36" y="132" fill="#fff" font-size="17" font-weight="700">Type or paste text</text><text x="36" y="154" fill="#b4b4c6" font-size="13">SHA-1, SHA-256, SHA-384</text><text x="36" y="174" fill="#b4b4c6" font-size="13">and SHA-512 appear live</text><text x="333" y="128" fill="#18c8ff" font-size="28" text-anchor="middle">›</text><rect x="353" y="52" width="293" height="140" rx="12" fill="#0b0b10" stroke="#262633"/><circle cx="383" cy="82" r="15" fill="url(#g)"/><text x="383" y="88" text-anchor="middle" fill="#05050c" font-size="16" font-weight="700">2</text><text x="630" y="92" font-size="30" text-anchor="end">🔑</text><text x="369" y="132" fill="#fff" font-size="17" font-weight="700">Enter a password</text><text x="369" y="154" fill="#b4b4c6" font-size="13">Strength bar and entropy</text><text x="369" y="174" fill="#b4b4c6" font-size="13">update as you type</text><text x="666" y="128" fill="#18c8ff" font-size="28" text-anchor="middle">›</text><rect x="686" y="52" width="293" height="140" rx="12" fill="#0b0b10" stroke="#262633"/><circle cx="716" cy="82" r="15" fill="url(#g)"/><text x="716" y="88" text-anchor="middle" fill="#05050c" font-size="16" font-weight="700">3</text><text x="963" y="92" font-size="30" text-anchor="end">⏱️</text><text x="702" y="132" fill="#fff" font-size="17" font-weight="700">Read the result</text><text x="702" y="154" fill="#b4b4c6" font-size="13">Crack-time estimate and</text><text x="702" y="174" fill="#b4b4c6" font-size="13">tips to improve it</text></svg>