<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" role="img" aria-label="How the Steganography Studio works" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#18c8ff"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="1000" height="210" rx="16" fill="#14141b" stroke="#262633"/><text x="24" y="34" fill="#fff" font-size="18" font-weight="700">How the Steganography Studio works</text><rect x="20" y="52" width="210" height="140" rx="12" fill="#0b0b10" stroke="#262633"/><circle cx="50" cy="82" r="15" fill="url(#g)"/><text x="50" y="88" text-anchor="middle" fill="#05050c" font-size="16" font-weight="700">1</text><text x="214" y="92" font-size="30" text-anchor="end">🖼️</text><text x="36" y="132" fill="#fff" font-size="17" font-weight="700">Upload image</text><text x="36" y="154" fill="#b4b4c6" font-size="13">Pick a PNG or JPG from</text><text x="36" y="174" fill="#b4b4c6" font-size="13">your device</text><text x="250" y="128" fill="#18c8ff" font-size="28" text-anchor="middle">›</text><rect x="270" y="52" width="210" height="140" rx="12" fill="#0b0b10" stroke="#262633"/><circle cx="300" cy="82" r="15" fill="url(#g)"/><text x="300" y="88" text-anchor="middle" fill="#05050c" font-size="16" font-weight="700">2</text><text x="464" y="92" font-size="30" text-anchor="end">✍️</text><text x="286" y="132" fill="#fff" font-size="17" font-weight="700">Type your secret</text><text x="286" y="154" fill="#b4b4c6" font-size="13">Text is stored in the lowest</text><text x="286" y="174" fill="#b4b4c6" font-size="13">bits of the pixel colours</text><text x="500" y="128" fill="#18c8ff" font-size="28" text-anchor="middle">›</text><rect x="520" y="52" width="210" height="140" rx="12" fill="#0b0b10" stroke="#262633"/><circle cx="550" cy="82" r="15" fill="url(#g)"/><text x="550" y="88" text-anchor="middle" fill="#05050c" font-size="16" font-weight="700">3</text><text x="714" y="92" font-size="30" text-anchor="end">⬇️</text><text x="536" y="132" fill="#fff" font-size="17" font-weight="700">Download PNG</text><text x="536" y="154" fill="#b4b4c6" font-size="13">Share the file as a PNG,</text><text x="536" y="174" fill="#b4b4c6" font-size="13">never as a JPEG</text><text x="750" y="128" fill="#18c8ff" font-size="28" text-anchor="middle">›</text><rect x="770" y="52" width="210" height="140" rx="12" fill="#0b0b10" stroke="#262633"/><circle cx="800" cy="82" r="15" fill="url(#g)"/><text x="800" y="88" text-anchor="middle" fill="#05050c" font-size="16" font-weight="700">4</text><text x="964" y="92" font-size="30" text-anchor="end">🔓</text><text x="786" y="132" fill="#fff" font-size="17" font-weight="700">Decode anytime</text><text x="786" y="154" fill="#b4b4c6" font-size="13">Upload that PNG to</text><text x="786" y="174" fill="#b4b4c6" font-size="13">reveal the message</text></svg>